<!-- 调试信息 - 默认管理员账号 用户名: admin 密码: admin123 -->
{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2 class="card-title">用户注册</h2>
    {% if msg %}
        <div class="alert {% if '成功' in msg %}alert-success{% else %}alert-error{% endif %}">{{ msg }}</div>
    {% endif %}
    {% if msg and '成功' in msg %}
        <p style="text-align:center;margin-top:16px;"><a href="/login" class="btn btn-primary">前往登录</a></p>
    {% else %}
    <form method="post" action="/register" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" name="phone" class="form-input" placeholder="请输入手机号">
        </div>
        <button type="submit" class="btn btn-primary">注 册</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:#999;">
        已有账号？<a href="/login" style="color:#667eea;">去登录</a>
    </p>
    {% endif %}
</div>
{% endblock %}
