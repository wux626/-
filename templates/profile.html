{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2 class="card-title">个人中心</h2>
    <ul class="info-list">
        <li><span class="info-label">ID：</span>{{ user.id }}</li>
        <li><span class="info-label">用户名：</span>{{ user.username }}</li>
        <li><span class="info-label">邮箱：</span>{{ user.email or '未设置' }}</li>
        <li><span class="info-label">手机：</span>{{ user.phone or '未设置' }}</li>
        <li><span class="info-label">余额：</span><strong style="color:#e67e22;">¥{{ "%.2f"|format(user.balance or 0) }}</strong></li>
    </ul>
</div>

<div class="card">
    <h2 class="card-title">账户充值</h2>
    <form method="post" action="/recharge" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="amount">充值金额</label>
            <input type="number" id="amount" name="amount" class="form-input" placeholder="请输入金额（仅限正数）" step="0.01" min="0.01" max="99999" required>
        </div>
        <button type="submit" class="btn btn-primary">确认充值</button>
    </form>
</div>

<div class="card">
    <h2 class="card-title">修改密码</h2>
    <form method="post" action="/change-password" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="username" value="{{ user.username }}">
        <div class="form-group">
            <label for="new_password">新密码</label>
            <input type="password" id="new_password" name="new_password" class="form-input" placeholder="请输入新密码" minlength="6" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">确认密码</label>
            <input type="password" id="confirm_password" class="form-input" placeholder="请再次输入新密码" minlength="6" required
                   oninput="this.style.borderColor=this.value==document.getElementById('new_password').value?'#22c55e':'#ef4444'">
        </div>
        <button type="submit" class="btn btn-primary">修改密码</button>
    </form>
</div>

<div style="text-align:center;margin-top:16px;">
    <a href="/" class="btn btn-primary" style="background:#667eea;">返回首页</a>
</div>
{% endblock %}
